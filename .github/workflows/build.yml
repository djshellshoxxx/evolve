name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release from this build"
        type: boolean
        default: false
      suffix:
        description: "Pre-release suffix for a manual release, e.g. beta.1 gives v0.3.0-beta.1"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04,   name: linux-x64 }
          - { os: macos-latest,   name: macos-universal }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev libgtk-3-dev ninja-build

      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release "$extra"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          set -e
          ver=$(sed -n 's/^project(MUTAGEN VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # A tag such as v0.3.0-beta.1 names the package; otherwise use the CMake version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${{ inputs.suffix }}" ]; then ver="$ver-${{ inputs.suffix }}"; fi
          art=build/MUTAGEN_artefacts/Release
          out=MUTAGEN-$ver-${{ matrix.name }}
          mkdir -p "$out"
          cp -R "$art/VST3/MUTAGEN.vst3" "$out/"
          cp -R "$art/CLAP/MUTAGEN.clap" "$out/"
          case "$RUNNER_OS" in
            Windows) cp "$art/Standalone/MUTAGEN.exe" "$out/" ;;
            Linux)   cp "$art/Standalone/MUTAGEN" "$out/" ;;
            macOS)   cp -R "$art/Standalone/MUTAGEN.app" "$out/"; cp -R "$art/AU/MUTAGEN.component" "$out/" ;;
          esac
          cp LICENSE README.md "$out/"
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "$out.zip" "$out" > /dev/null; echo "PKG=$out.zip" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent "$out" "$out.zip"; echo "PKG=$out.zip" >> "$GITHUB_ENV"
          else tar czf "$out.tar.gz" "$out"; echo "PKG=$out.tar.gz" >> "$GITHUB_ENV"; fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: MUTAGEN-${{ matrix.name }}
          path: ${{ env.PKG }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version
        run: |
          ver="$(sed -n 's/^project(MUTAGEN VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="${GITHUB_REF_NAME#v}"; fi
          if [ -n "${{ inputs.suffix }}" ]; then ver="$ver-${{ inputs.suffix }}"; fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          case "$ver" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          name: MUTAGEN ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          target_commitish: ${{ github.sha }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
